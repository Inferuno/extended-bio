<!DOCTYPE html>
<html lang="en" data-mode="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inferuno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0..1,0&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wall" aria-hidden="true"></div>
    <header class="bar">
        <nav class="island nav">
            <!-- Sliding pill for nav bar, positioned by script.js -->
            <span class="nav-thumb"></span>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#board">Board</a>
        </nav>
        <div class="island controls">
            <button class="icon-btn" type="button" id="mode" aria-label="Switch to light mode">
                <span class="material-symbols-rounded">light_mode</span>
            </button>
            <button class="icon-btn" type="button" id="play" aria-label="Play">
                <span class="material-symbols-rounded">play_arrow</span>
            </button>
        </div>
    </header>

    <figure class="banner">
        <img src="assets/brand/banner.jpg" alt="">
    </figure>

    <div class="identity">
        <div class="avatar">
            <img class="avatar-img" src="assets/brand/avatar.jpg" alt="">
        </div>
        <h1>Inferuno</h1>
        <p class="bio">Hello, I'm Inferuno!

            Mainly play Wuwa,
            UL 80 | NA server
            Saving for 980 pulls</p>
    </div>

    <main class="shell">
        <!-- Each hue is for the color shift. -->
        <section id="about" data-hue="20">
        </section>

        <section id="projects" data-hue="150">
            <h2>Projects</h2>
            <div class="grid">
                <button class="card" type="button" data-url="https://github.com/Inferuno/portfolio" data-label="Source">
                    <span class="thumb"></span>
                    <h3>Extended Bio</h3>
                    <div class="sub">JS, CSS, HTML</div>
                    <p class="blurb">An extended bio I can use to share projects and an about me without limitations.
                    </p>
                </button>
            </div>
        </section>

        <section id="board" data-hue="260">
            <h2>Board</h2>
        </section>
    </main>

    <div class="scrim" id="scrim" hidden></div>

    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="s-title" hidden>
        <button class="icon-btn" type="button" id="s-close" aria-label="Close">
            <span class="material-symbols-rounded">close</span>
        </button>
        <span class="thumb"></span>
        <div class="s-head">
            <h2 id="s-title"></h2>
            <a class="btn" id="s-open" href="#" target="_blank"></a>
        </div>
        <div id="s-meta"></div>
        <p id="s-blurb"></p>
    </div>
    <script src="script.js"></script>
</body>

</html>
