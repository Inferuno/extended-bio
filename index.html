<!DOCTYPE html>
<html lang="en" data-mode="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inferuno</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300,0..1,0&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="bg-gradient" aria-hidden="true"></div>
    <header class="bar">
        <nav class="island nav">
            <!-- Sliding indicator for nav bar, positioned by script.js -->
            <span class="nav-indicator"></span>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#board">Board</a>
        </nav>
        <div class="island controls">
            <button class="icon-btn" type="button" id="mode" aria-label="Switch to light mode">
                <span class="material-symbols-rounded">light_mode</span>
            </button>
        </div>
    </header>

    <figure class="banner">
        <img src="assets/brand/banner.jpg" alt="">
    </figure>

    <div class="identity">
        <div class="avatar">
            <img class="avatar-img" src="assets/brand/avatar.jpg" alt="">
        </div>
        <h1></h1>
        <p class="handle"></p>
        <p class="bio"></p>
    </div>

    <main class="shell">
        <!-- Each hue is for the color shift. -->
        <section id="about" data-hue="20">
        </section>

        <section id="projects" data-hue="150">
            <h2>Projects</h2>
            <div class="grid">
            </div>
        </section>

        <section id="board" data-hue="260">
            <h2>Board</h2>
            <div class="board">
                <div class="widget" id="widget-github">
                    <h3>Github</h3>
                </div>
                <div class="widget" id="widget-wuwa">
                    <h3>Wuthering Waves</h3>
                    <div class="stats"></div>
                    <div class="notes"></div>
                    <div class="profile"></div>
                </div>
                <div class="widget" id="widget-steam">
                    <h3>Steam</h3>
                </div>
                <div class="widget" id="widget-links">
                    <h3>Links</h3>
                    <div class="links"></div>
                </div>
            </div>
        </section>
    </main>

    <div class="card-preview-overlay" id="card-preview-overlay" hidden></div>

    <div class="card-preview" id="card-preview" role="dialog" aria-modal="true" aria-labelledby="card-preview-title"
        hidden>
        <button class="icon-btn" type="button" id="card-preview-close" aria-label="Close">
            <span class="material-symbols-rounded">close</span>
        </button>
        <span class="card-thumbnail"></span>
        <div class="card-preview-header">
            <h2 id="card-preview-title"></h2>
            <a class="btn" id="card-preview-open" href="#" target="_blank"></a>
        </div>
        <div id="card-preview-stack"></div>
        <p id="card-preview-blurb"></p>
    </div>
    <script src="script.js"></script>
</body>

</html>
